<title>JustTalk: выбор стиля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: control groups on the left, live phone pinned on the right; calm mono palette taken from the user's TG refs */
:root {
  --bg: #f1f1f3;
  --surface: #ffffff;
  --ink: #141416;
  --muted: #6c6c74;
  --line: #dcdce1;
  --pick: #6b5ff0;
  --pick-soft: #ebe9ff;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e10; --surface: #18181b; --ink: #f2f2f4; --muted: #9a9aa3; --line: #2a2a2f;
    --pick: #8d84ff; --pick-soft: #24213f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --surface: #18181b; --ink: #f2f2f4; --muted: #9a9aa3; --line: #2a2a2f;
  --pick: #8d84ff; --pick-soft: #24213f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 100px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 4.5vw, 40px); line-height: 1.1; letter-spacing: -0.02em; }
h2 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 64ch; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; }
.panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px 28px; min-width: 0; align-content: start; }
.group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.group .hint { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 500 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { border-color: var(--muted); }
.seg button:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(127,127,127,.4); }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.btn { font: 600 13px var(--f-ui); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.summary { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-family: var(--f-mono); font-size: 12px; white-space: pre-wrap; margin: 0; }
.refs { font-size: 13px; color: var(--muted); }

/* ===== phone ===== */
.phone { width: 340px; max-width: 100%; height: 720px; border-radius: 50px; padding: 10px; background: #050506; box-shadow: 0 0 0 1px #2a2a2e, 0 24px 60px rgba(0,0,0,.28); }
.scr { position: relative; height: 100%; border-radius: 41px; overflow: hidden; background: var(--s-bg); color: var(--s-ink); font-family: var(--s-font); font-size: 14px; }
.scr[data-pal="black"]    { --s-bg: #000000; --s-1: #131315; --s-2: #1f1f22; --s-ink: #f4f4f6; --s-mut: #8b8b93; --s-line: rgba(255,255,255,.07); --s-glass: rgba(28,28,32,.55); --s-glass-b: rgba(255,255,255,.12); }
.scr[data-pal="graphite"] { --s-bg: #17171a; --s-1: #222226; --s-2: #2d2d32; --s-ink: #f2f2f4; --s-mut: #95959e; --s-line: rgba(255,255,255,.07); --s-glass: rgba(40,40,46,.55); --s-glass-b: rgba(255,255,255,.12); }
.scr[data-pal="light"]    { --s-bg: #f5f5f7; --s-1: #ffffff; --s-2: #ececf0; --s-ink: #111114; --s-mut: #74747c; --s-line: rgba(0,0,0,.06); --s-glass: rgba(255,255,255,.6); --s-glass-b: rgba(0,0,0,.08); }
.scr[data-bg="grid"] { background-image: linear-gradient(var(--s-line) 1px, transparent 1px), linear-gradient(90deg, var(--s-line) 1px, transparent 1px); background-size: 22px 22px; }
.view { position: absolute; inset: 0; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.ibtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--s-ink); background: var(--s-1); border: 0; flex-shrink: 0; }
.ibtn svg, .tab svg { width: 20px; height: 20px; }
.search { height: 38px; border-radius: 12px; background: var(--s-1); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--s-mut); }
.search svg { width: 16px; height: 16px; }
.chips { display: flex; gap: 6px; overflow: hidden; }
.chip { padding: 5px 12px; border-radius: 99px; font-size: 12px; background: var(--s-1); color: var(--s-mut); white-space: nowrap; }
.chip.on { background: var(--s-acc); color: var(--s-on); }
.stories { display: flex; gap: 12px; }
.story { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--s-mut); }
.ava { border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: var(--s-ink); background: var(--s-2); position: relative; flex-shrink: 0; }
.ava.ring { box-shadow: 0 0 0 2px var(--s-bg), 0 0 0 3.5px var(--s-acc); }
.ava .on { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: #34c46a; border: 2px solid var(--s-bg); }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 9px 4px; }
.item .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.item .top, .item .bot { display: flex; align-items: center; gap: 8px; }
.item .name { flex: 1; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .time { font-size: 11px; color: var(--s-mut); }
.item .last { flex: 1; font-size: 13px; color: var(--s-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--s-acc); color: var(--s-on); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.udot { width: 8px; height: 8px; border-radius: 50%; background: var(--s-acc); }
.checks { color: var(--s-mut); display: inline-flex; }
.checks.read { color: var(--s-acc); }
.tk { width: 16px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.msg .t { display: flex; align-items: center; justify-content: flex-end; gap: 3px; }
.msg .t .tk { width: 14px; height: 10px; }
.scr[data-cards="pills"] .list, .scr[data-cards="tint"] .list { gap: 8px; }
.scr[data-cards="pills"] .item, .scr[data-cards="tint"] .item { background: var(--s-1); border-radius: 26px; padding: 9px 14px 9px 9px; }
.scr[data-cards="tint"] .item.unread { background: color-mix(in srgb, var(--s-acc) 20%, var(--s-1)); }
.section { font-size: 12px; color: var(--s-mut); margin-top: 2px; }

/* tab bar */
.tabs { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; height: 60px; border-radius: 30px; display: flex; align-items: center; gap: 4px; padding: 0 6px; z-index: 5; }
.scr[data-tbs="glass"] .tabs { background: var(--s-glass); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--s-glass-b); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.scr[data-tbs="white"] .tabs { background: #ffffff; --t-ink: #111114; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.scr[data-tbs="solid"] .tabs { background: var(--s-1); border: 1px solid var(--s-line); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.tab { height: 48px; min-width: 52px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--t-ink, var(--s-ink)); font-size: 13px; font-weight: 600; padding: 0 12px; }
.tab.on { background: var(--s-acc); color: var(--s-on); }
.scr[data-tab="circle"] .tab.on { width: 48px; min-width: 48px; padding: 0; }
.scr[data-tab="center"] .tabs { overflow: visible; }
.scr[data-tab="center"] .tab.on { width: 58px; height: 58px; min-width: 58px; border-radius: 50%; padding: 0; box-shadow: 0 0 0 5px var(--s-bg); }
.tab.new { background: var(--s-acc); color: var(--s-on); padding: 0 20px; }

/* chat */
.chead { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--s-line); }
.chead .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.chead .who b { font-size: 15px; }
.chead .who span { font-size: 11px; color: var(--s-mut); display: flex; align-items: center; gap: 5px; }
.chead .who span i { width: 7px; height: 7px; border-radius: 50%; background: #34c46a; }
.plain { background: transparent; border: 0; color: var(--s-ink); padding: 4px; display: grid; place-items: center; }
.plain svg { width: 20px; height: 20px; }
.feed { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-bottom: 76px; scrollbar-width: none; }
.feed > :first-child { margin-top: auto; }
.view.scroll { overflow-y: auto; padding-bottom: 110px; scrollbar-width: none; }
.feed::-webkit-scrollbar, .view.scroll::-webkit-scrollbar { display: none; }
.scr [data-go], .scr [data-act], .scr [data-set], .scr [data-slide] { cursor: pointer; }
.scr [data-slide] { touch-action: none; }
.field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--s-ink); font: inherit; font-size: 14px; }
.field input::placeholder { color: var(--s-mut); }
.inp input { background: transparent; border: 0; outline: none; color: var(--s-ink); font: inherit; font-size: 15px; padding: 0; width: 100%; }
.inp input::placeholder { color: var(--s-mut); opacity: .7; }
.send { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--s-acc); color: var(--s-on); flex: none !important; }
.send svg { width: 16px !important; height: 16px !important; color: inherit !important; }
.toast { position: absolute; left: 50%; top: 54px; transform: translateX(-50%); z-index: 20; background: var(--s-ink); color: var(--s-bg); padding: 9px 16px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: drop .25s ease-out; }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -8px); } }
.typing { font-style: normal; color: var(--s-acc); }
.react.liked { background: color-mix(in srgb, #ff4d6d 22%, var(--s-2)); }
.wave.playing i { animation: wv .7s ease-in-out infinite alternate; }
.wave.playing i:nth-child(2n) { animation-delay: .2s; }
.wave.playing i:nth-child(3n) { animation-delay: .4s; }
@keyframes wv { to { transform: scaleY(.4); } }
.pin.dim { opacity: .25; }
.tgl { width: 40px; height: 24px; border-radius: 12px; background: var(--s-2); position: relative; flex: none !important; transition: background .2s; }
.tgl b { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--s-mut); transition: left .2s, background .2s; }
.tgl.on { background: var(--s-acc); }
.tgl.on b { left: 19px; background: var(--s-on); }
.msg { max-width: 78%; padding: 8px 12px; line-height: 1.35; position: relative; border-radius: var(--s-r); }
.msg .t { display: block; text-align: right; font-size: 10px; margin-top: 2px; opacity: .65; }
.msg.them { align-self: flex-start; background: var(--s-1); }
.msg.me { align-self: flex-end; }
.scr[data-bub="gray"] .msg.me { background: var(--s-2); }
.scr[data-bub="accent"] .msg.me { background: var(--s-acc); color: var(--s-on); }
.scr[data-bub="outline"] .msg.me { background: transparent; box-shadow: inset 0 0 0 1.5px var(--s-acc); }
.scr[data-tail="yes"] .msg.them.last { border-bottom-left-radius: 5px; }
.scr[data-tail="yes"] .msg.me.last { border-bottom-right-radius: 5px; }
.gap { margin-top: 6px; }
.photo { width: 190px; height: 120px; border-radius: calc(var(--s-r) - 6px); background: linear-gradient(135deg, var(--s-2), color-mix(in srgb, var(--s-acc) 35%, var(--s-2))); margin-bottom: 4px; display: grid; place-items: center; color: var(--s-mut); font-size: 11px; }
.react { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: 2px 8px; border-radius: 99px; background: var(--s-2); font-size: 11px; }
.react svg { width: 11px; height: 11px; color: #ff4d6d; }
.voice { display: flex; align-items: center; gap: 8px; }
.play { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--s-acc); color: var(--s-on); flex-shrink: 0; }
.scr[data-bub="accent"] .msg.me .play { background: var(--s-on); color: var(--s-acc); }
.play svg { width: 12px; height: 12px; }
.wave { display: flex; align-items: center; gap: 2px; height: 24px; }
.wave i { width: 2.5px; border-radius: 2px; background: currentColor; opacity: .75; }
.comp { position: absolute; left: 12px; right: 12px; bottom: 22px; display: flex; align-items: center; gap: 8px; z-index: 5; }
.comp .field { flex: 1; height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 8px 0 14px; color: var(--s-mut); gap: 8px; }
.scr[data-tbs="glass"] .comp .field, .scr[data-tbs="glass"] .comp .ibtn { background: var(--s-glass); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--s-glass-b); }
.scr:not([data-tbs="glass"]) .comp .field { background: var(--s-1); }
.comp .ibtn { width: 44px; height: 44px; }
.comp .field span { flex: 1; }
.comp .field svg { width: 20px; height: 20px; color: var(--s-ink); }

/* profile */
.pro { align-items: center; text-align: center; gap: 4px; padding-top: 6px; }
.pro .nm { font-size: 20px; font-weight: 700; margin-top: 8px; }
.pro .un { color: var(--s-acc); font-size: 13px; }
.pro .ab { color: var(--s-mut); font-size: 13px; max-width: 30ch; }
.cardgrp { width: 100%; background: var(--s-1); border-radius: 18px; padding: 4px 0; text-align: left; }
.cardgrp div { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; }
.cardgrp div + div { border-top: 1px solid var(--s-line); }
.cardgrp i { width: 26px; height: 26px; border-radius: 8px; background: color-mix(in srgb, var(--s-acc) 22%, var(--s-2)); display: grid; place-items: center; color: var(--s-acc); font-style: normal; }
.cardgrp i svg { width: 15px; height: 15px; }
.cardgrp span { flex: 1; }
.cardgrp em { font-style: normal; color: var(--s-mut); font-size: 13px; }

/* map */
.mapbg { position: absolute; inset: 0; background: var(--s-1); }
.mapbg svg { width: 100%; height: 100%; display: block; }
.mapbg .road { stroke: var(--s-2); stroke-width: 14; fill: none; stroke-linecap: round; }
.mapbg .road.thin { stroke-width: 7; }
.mapbg .park { fill: color-mix(in srgb, #34c46a 14%, var(--s-1)); }
.mapbg .river { stroke: color-mix(in srgb, #4d7cff 22%, var(--s-1)); stroke-width: 26; fill: none; }
.pin { position: absolute; width: 34px; height: 34px; margin: -34px 0 0 -17px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: var(--s-ink); color: var(--s-bg); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.pin svg { width: 16px; height: 16px; transform: rotate(45deg); }
.pin.sel { background: var(--s-acc); color: var(--s-on); width: 44px; height: 44px; margin: -44px 0 0 -22px; }
.me-dot { position: absolute; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: #4d7cff; box-shadow: 0 0 0 4px rgba(77,124,255,.25), 0 0 0 2px #fff inset; }
.floaty { background: var(--s-glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.sheet { position: absolute; left: 12px; right: 12px; bottom: 96px; padding: 10px; border-radius: 24px; background: var(--s-bg); box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 4; }
.stack { display: flex; }
.stack .ava + .ava { margin-left: -8px; }
/* music */
.now { background: var(--s-1); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.cover { border-radius: 12px; flex-shrink: 0; background: linear-gradient(135deg, var(--s-2), color-mix(in srgb, var(--s-acc) 45%, var(--s-2))); }
.score { font-size: 30px; font-weight: 700; color: var(--s-acc); font-variant-numeric: tabular-nums; }
.crit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.crit div { display: grid; grid-template-columns: 60px minmax(0, 1fr) 12px; align-items: center; gap: 6px; font-size: 12px; color: var(--s-mut); }
.crit b { color: var(--s-ink); text-align: right; }
.bar { height: 5px; border-radius: 3px; background: var(--s-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--s-acc); border-radius: 3px; }
.rank { width: 16px; font-size: 13px; color: var(--s-mut); text-align: center; font-variant-numeric: tabular-nums; }
.item b { font-variant-numeric: tabular-nums; }
.fab { position: absolute; right: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--s-acc); color: var(--s-on); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.35); z-index: 4; }
.fab svg { width: 24px; height: 24px; }
/* forms, segmented controls */
.segs { display: flex; background: var(--s-1); border-radius: 12px; padding: 3px; gap: 3px; }
.sg { flex: 1; text-align: center; padding: 6px 8px; border-radius: 9px; font-size: 12px; color: var(--s-mut); white-space: nowrap; }
.sg.on { background: var(--s-2); color: var(--s-ink); font-weight: 600; }
.twoseg { display: flex; gap: 8px; }
.twoseg .segs:first-child { flex: 1.5; }
.twoseg .segs { flex: 1; }
.note { font-size: 11px; color: var(--s-mut); }
.inp { background: var(--s-1); border-radius: 14px; padding: 7px 14px; display: flex; flex-direction: column; font-size: 15px; flex-shrink: 0; }
.inp span { font-size: 11px; color: var(--s-mut); }
.lbl2 { font-size: 12px; color: var(--s-mut); margin-bottom: -4px; }
.chips.multi { flex-wrap: wrap; }
.view > * { flex-shrink: 0; }
.minimap { position: relative; height: 112px; border-radius: 18px; overflow: hidden; flex-shrink: 0; }
.photos { display: flex; gap: 8px; }
.photos > * { width: 52px; height: 52px; border-radius: 14px; }
.addph { border: 1.5px dashed var(--s-mut); display: grid; place-items: center; color: var(--s-mut); }
.addph svg { width: 20px; height: 20px; }
.cta { margin-top: auto; margin-bottom: 26px; height: 48px; border-radius: 24px; background: var(--s-acc); color: var(--s-on); display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }
/* rating rows */
.rows { display: flex; flex-direction: column; gap: 2px; }
.crow { display: grid; grid-template-columns: 104px minmax(0, 1fr) 22px; align-items: center; gap: 10px; height: 22px; font-size: 12.5px; }
.rows.shared .crow { grid-template-columns: 96px minmax(0, 1fr) 22px 30px; }
.crow .cn.skip { color: var(--s-mut); text-decoration: line-through; }
.crow .cv { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.crow .ck { text-align: right; color: var(--s-mut); font-variant-numeric: tabular-nums; }
.crow.head { height: 14px; font-size: 10px; color: var(--s-mut); }
.crow.head .cv { font-weight: 400; }
.slider { position: relative; height: 4px; border-radius: 2px; background: var(--s-2); margin: 0 8px; }
.slider i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s-acc); border-radius: 2px; }
.slider b { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--s-ink); }

const MICOFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>';

// last message of a chat for the list row: text, time and (if mine) the message for its ticks
function preview(name) {
  const what = m => m.k === "voice" ? "Голосовое сообщение" : m.k === "photo" ? `Фото · ${m.x}` : m.x;
  if (name === "Кенты") {
    const m = app.group[app.group.length - 1];
    if (m.w === "botcard") return { x: `JT бот: ${m.k === "split" ? "посчитал, кто сколько должен" : m.x}`, t: now() };
    return { x: `${m.w === "me" ? "Вы" : m.a}: ${m.x}`, t: m.t, m: m.w === "me" ? m : null };
  }
  if (name === "JT бот") {
    const m = app.ai[app.ai.length - 1];
    if (!m) return { x: "Начни новый чат", t: "" };
    return { x: m.w === "think" ? "думает…" : m.w === "me" ? `Вы: ${m.x}` : m.x, t: "18:21", m: m.w === "me" ? m : null };
  }
  const list = app.chats[name] || [];
  const m = list[list.length - 1];
  if (!m) return { x: "Пока пусто", t: "" };
  return { x: (m.w === "me" ? "Вы: " : m.a ? `${m.a}: ` : "") + what(m), t: m.t, m: m.w === "me" ? m : null };
}

function msgList(list) {
  const bars = [6, 12, 18, 10, 20, 14, 8, 16, 22, 12, 6, 14, 18, 9, 13, 7, 11, 5].map(h => `<i style="height:${h}px"></i>`).join("");
  return list.map((m, i) => {
    const prev = list[i - 1], next = list[i + 1];
    const cls = `msg ${m.w} ${!next || next.w !== m.w ? "last" : ""} ${prev && prev.w !== m.w ? "gap" : ""}`;
    const t = `<span class="t">${m.t}${m.w === "me" ? tick(m) : ""}</span>`;
    if (m.k === "photo") return `<div class="${cls}" style="padding:6px"><div class="photo" data-act="photo">фото: новые перила</div><div style="padding:0 6px">${m.x}</div>
      <div style="padding:0 6px"><span class="react ${app.liked ? "liked" : ""}" data-act="like">${I.heart}${app.liked ? 3 : 2}</span><span class="t" style="display:inline;float:right;margin-top:6px">${m.t}</span></div></div>`;
    if (m.k === "voice") return `<div class="${cls}"><div class="voice"><span class="play" data-act="play">${app.playing ? PAUSE : I.playI}</span><span class="wave ${app.playing ? "playing" : ""}">${bars}</span></div><span class="t">0:37 · ${m.t}${m.w === "me" ? tick(m) : ""}</span></div>`;
    return `<div class="${cls}">${m.x}${t}</div>`;
  }).join("");
}

const critKey = () => st.rateMode === "simple" ? "simple" : st.rateKind;
const score = (crit, vals) => {
  let s = 0, w = 0;
  crit.forEach((c, i) => { if (vals[i] != null) { s += vals[i] * c[2]; w += c[2]; } });
  return w ? (s / w).toFixed(1) : "—";
};
const kentVal = (v, i) => Math.min(10, Math.max(1, v - 0.6 + (i % 4) * 0.4)).toFixed(1);

function rateView() {
  const album = st.rateKind === "album", simple = st.rateMode === "simple", shared = st.rateFor === "shared";
  const key = critKey(), crit = CRIT[key], vals = app.vals[key];
  const kent = score(crit, CRIT[key].map((c, i) => c[1] == null ? null : +kentVal(c[1], i)));
  const rows = crit.map(([n], i) => {
    const v = vals[i];
    return `<div class="crow"><span class="cn ${v == null ? "skip" : ""}" data-act="skip" data-i="${i}">${n}</span>
    <span class="slider" data-slide="${i}">${v == null ? "" : `<i style="width:${v * 10}%"></i><b style="left:${v * 10}%"></b>`}</span>
    <span class="cv">${v ?? "—"}</span>${shared ? `<span class="ck">${crit[i][1] == null ? "—" : kentVal(crit[i][1], i)}</span>` : ""}</div>`;
  }).join("");
  return `<div class="view" style="gap:9px">
    <div class="row-between">${back("music")}<b data-act="kind">${album ? "Оценка альбома" : "Оценка трека"} ▾</b><span class="plain" data-act="editRated" aria-label="Изменить данные">${I.edit}</span></div>

    </div>
    <div class="twoseg">
      <div class="segs"><span class="sg ${shared ? "" : "on"}" data-set="rateFor" data-v="me">Для себя</span><span class="sg ${shared ? "on" : ""}" data-set="rateFor" data-v="shared">Для кентов</span></div>

/* ===== navigation with slide animation ===== */
const PARENT = { chat: "list", ai: "list", story: "list", newChat: "list", kent: "chat", call: "chat", spot: "map", rate: "music", add: "music",
  privacy: "profile", editProfile: "profile", appearance: "profile" };
const TAB_POS = { list: 0, map: 10, music: 20, top: 21, mine: 22, profile: 30 };
const depth = s => PARENT[s] ? depth(PARENT[s]) + 1 : 0;
function direction(from, to) {
  if (from === to) return null;
  const MUSIC = ["music", "top", "mine"];
  if (MUSIC.includes(from) && MUSIC.includes(to)) return null;
  const a = depth(from), b = depth(to);
  if (a === 0 && b === 0) return TAB_POS[to] > TAB_POS[from] ? "right" : "left";
  if (b > a) return "push";
  if (b < a) return "pop";
  return "fade";
}

function render() {
  const s = $("scr");
  // keep focus and caret in a phone input across re-renders
  const focused = document.activeElement && s.contains(document.activeElement) ? document.activeElement.id : null;
  const [acc, on] = opt("acc", st.acc)[2];
  Object.assign(s.dataset, { pal: st.pal, tab: st.tab, tbs: st.tbs, cards: st.cards, bub: st.bub, tail: st.tail, bg: st.bg });
  s.style.setProperty("--s-acc", st.acc === "mono" && st.pal === "light" ? "#111114" : acc);
  s.style.setProperty("--s-on", st.acc === "mono" && st.pal === "light" ? "#ffffff" : on);
  s.style.setProperty("--s-r", st.rad + "px");
  s.style.setProperty("--s-font", `'${st.font}', system-ui, sans-serif`);
  const VIEWS = { list: listView, chat: chatView, map: mapView, spot: spotView, music: musicView, rate: rateView, top: topView, mine: mineView,
    ai: aiView, profile: profileView, kent: kentView, call: callView, story: storyView, newChat: newChatView, editProfile: editProfileView,
    privacy: privacyView, appearance: appearanceView, add: addView };

  const oldLayer = s.querySelector(":scope > .layer");
  const oldTabs = s.querySelector(":scope > .tabs");
  s.innerHTML = `<div class="layer">${(VIEWS[st.screen] || listView)()}</div>` + (app.sheet ? sheetHtml() : "") + (app.toast ? `<div class="toast">${app.toast}</div>` : "");
  app.sheetNew = false;
  const layer = s.querySelector(".layer");
  // lift the tab bar out of the screen so it stays put while screens slide
  const tabs = layer.querySelector(".tabs");
  if (tabs) s.insertBefore(tabs, layer.nextSibling);
  layer.querySelectorAll(".feed").forEach(f => { f.scrollTop = f.scrollHeight; });
  const dir = app.anim;
  app.anim = null;
  if (dir && oldLayer && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    if (!tabs && oldTabs) oldLayer.appendChild(oldTabs);
    s.insertBefore(oldLayer, layer);
    oldLayer.className = "layer out-" + dir;
    layer.classList.add("in-" + dir);
    setTimeout(() => { oldLayer.remove(); layer.classList.remove("in-" + dir); }, 340);
  }
  if (focused && $(focused)) { const el = $(focused); el.focus(); el.setSelectionRange?.(el.value.length, el.value.length); }

  GROUPS.forEach(([key, , , opts]) => opts.forEach(([id]) =>
    $(`o-${key}-${id.replace(/\s/g, "_")}`).setAttribute("aria-pressed", st[key] === id)));
  $("summary").textContent = summary();
}

function summary() {
  return "JustTalk, стиль\n" + GROUPS.filter(g => !PREVIEW_KEYS.includes(g[0]))
    .map(([key, title]) => `${title}: ${opt(key, st[key])[1]}`).join("\n");
}

/* ===== phone interactions ===== */
let toastTimer, storyTimer, callTimer;
function toast(msg) {
  app.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { app.toast = ""; render(); }, 1700);
}
function go(screen, extra = {}) {
  app.anim = direction(st.screen, screen);
  app.sheet = null;
  clearTimeout(storyTimer);
  if (st.screen === "call" && screen !== "call") { clearInterval(callTimer); app.callStart = null; }
  Object.assign(st, { screen }, extra); save(); render();
  if (screen === "story") storyTimer = setTimeout(() => ACTS.storyNext(), 4000);
}
const later = (ms, fn) => setTimeout(() => { fn(); render(); }, ms);

function botReply(text) {
  const q = text.toLowerCase();
  if (q.includes("итог")) return { trail: ["прочитал «Кенты»"], x: "За сегодня в «Кентах» 46 сообщений: договорились на ступени в 19:00, Дэн берёт колонку, Макс потерял ключи от гаража." };
  if (q.includes("трек") || q.includes("музык")) return { trail: ["открыл топ кентов"], x: "Вот что сейчас выше всех у кентов:", card: "track" };
  if (q.includes("покат") || q.includes("спот")) return { trail: ["открыл карту", "проверил, кто где"], x: "Ближе всего два места:", card: "spots" };
  if (q.includes("собер") || q.includes("сбор")) return { trail: ["прочитал «Кенты»"], x: "Сделал сбор, глянь:", card: "meet" };
  return { x: "Понял. Это демо: живые ответы даст Claude, когда подключим бэкенд." };
}

function askBot(text) {
  if (st.screen !== "ai" || st.aiMode !== "dm") { if (st.aiMode !== "dm") app.ai = []; go("ai", { aiMode: "dm" }); }
  app.ai.push({ w: "me", x: text });
  const think = { w: "think", x: /трек|музык/i.test(text) ? "Смотрю топ кентов…" : /спот|покат/i.test(text) ? "Смотрю карту…" : "Думаю…" };
  later(400, () => app.ai.push(think));
  later(1900, () => { app.ai.splice(app.ai.indexOf(think), 1); app.ai.push({ w: "bot", ...botReply(text) }); });
  render();
}

function send(id) {
  const input = $(id);
  const text = (input?.value || "").trim();
  if (!text) return;
  app.inputs[id] = "";
  if (id === "chatInput") {
    const list = app.chats[app.chatWith[0]];
    list.push({ w: "me", k: "text", x: text, t: now(), read: false });
    later(900, () => { app.typing = true; list.forEach(m => { if (m.w === "me") m.read = true; }); });
    later(2300, () => { app.typing = false; list.push({ w: "them", k: "text", x: REPLIES[Math.floor(Math.random() * REPLIES.length)], t: now() }); });
  } else if (id === "aiInput") {
    askBot(text); return;
  } else if (id === "groupInput") {
    app.group.push({ w: "me", x: text, t: now(), read: false });
    later(1200, () => app.group.forEach(m => { if (m.w === "me") m.read = true; }));
    if (/@бот/i.test(text)) later(1500, () => app.group.push({ w: "botcard", x: "Принял, отвечу всем. В демо это заглушка, живой ответ будет от Claude." }));
  }
  render();
}

function startCall(name, l, cam) {
  app.callWith = [name, l]; app.callFrom = st.screen; app.tg.cam = cam; app.callStart = null;
  go("call");
  clearInterval(callTimer);
  setTimeout(() => {
    if (st.screen !== "call") return;
    app.callStart = Date.now();
    callTimer = setInterval(() => {
      const el = $("callStatus");
      if (!el) return clearInterval(callTimer);
      const sec = Math.floor((Date.now() - app.callStart) / 1000);
      el.textContent = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    }, 500);
  }, 1500);
}

const ACTS = {
  noop: () => {},
  toast: d => toast(d.msg),
  close: () => { app.sheet = null; render(); },
  sheet: d => { app.sheet = d.v; app.sheetNew = true; render(); },
  sheetPick: d => {
    app.sheet = null;
    if (d.a === "go") return go(d.v);
    if (d.a === "ask") return askBot(d.v);
    if (d.a === "kent") return ACTS.kent({ name: d.v });
    if (d.a === "toast") return toast(d.v);
    render();
  },
  listFilter: d => { app.listFilter = d.v; render(); },
  open: d => {
    delete app.unread[d.name];
    if (d.name === "Кенты") return go("ai", { aiMode: "group" });
    if (d.name === "JT бот") return go("ai", { aiMode: "dm" });
    app.chatWith = [d.name, d.l]; go("chat");
  },
  kent: d => { app.kent = KENTS.find(k => k[0] === d.name) || [d.name, d.name[0], d.name.toLowerCase(), "Кент"]; go("kent"); },
  story: d => { app.story = +d.i; go("story"); },
  storyNext: () => {
    if (st.screen !== "story") return;
    if (app.story < STORIES.length - 1) { app.story++; app.anim = "fade"; render(); clearTimeout(storyTimer); storyTimer = setTimeout(() => ACTS.storyNext(), 4000); }
    else go("list");
  },
  call: d => {
    if (d.name) return startCall(d.name, d.l, d.cam === "1");

    startCall(name, l, d.cam === "1");
  },
  callTog: (d, el) => {
    app.tg[d.k] = !app.tg[d.k];
    if (d.k === "cam") return render();
    el.classList.toggle(d.k === "mic" ? "off" : "on", d.k === "mic" ? !app.tg.mic : app.tg[d.k]);
    if (d.k === "mic") el.firstElementChild.outerHTML = app.tg.mic ? I.mic : MICOFF;
  },
  hang: () => go(app.callFrom === "call" ? "list" : app.callFrom),
  photo: () => toast("Фото откроется на весь экран"),
  like: () => { app.liked = !app.liked; render(); },
  play: () => { app.playing = !app.playing; render(); },
  send: d => send(d.for),
  ask: d => askBot(d.v),
  newAi: () => { app.ai = []; go("ai", { aiMode: "empty" }); },
  sendCard: d => { app.sent[d.i] = true; toast("Сбор отправлен в «Кенты»"); },
  remind: () => { app.remind = !app.remind; render(); },
  equal: () => { app.equal = !app.equal; render(); },
  // switches flip in place so the CSS transition plays
  tog: (d, el) => { app.tg[d.k] = !app.tg[d.k]; el.querySelector(".tgl").classList.toggle("on", app.tg[d.k]); },
  profileVis: d => { app.profileVis = d.v; render(); },

  saveProfile: (d, el) => {

    const i = app.inputs;

    delete i.epName; delete i.epUser; delete i.epAbout;
    go("profile"); toast("Профиль сохранён");
  },
  pick: d => { const p = app.picked; p.includes(d.name) ? p.splice(p.indexOf(d.name), 1) : p.push(d.name); render(); },
  createChat: (d, el) => {

  pin: d => { app.pin = +d.i; render(); },
  pinGo: d => { app.pin = +d.i; go("map"); },
  mapFilter: d => { app.mapFilter = d.v; render(); },
  spotType: d => { const t = app.spot.types; t.includes(d.v) ? t.splice(t.indexOf(d.v), 1) : t.push(d.v); render(); },
  spotCover: d => { app.spot.cover = d.v; render(); },

  addPhoto: () => { app.spot.photos = Math.min(4, app.spot.photos + 1); render(); },
  rmPhoto: () => { app.spot.photos = Math.max(0, app.spot.photos - 1); render(); },
  spotSave: () => {

    SPOTS.push({ name, x: Math.round(sp.px * 3.2), y: Math.round(sp.py * 4.6) + 40, desc: `${sp.types.join(" · ") || "Без тегов"} · ${sp.cover.toLowerCase()}`, km: "тут", who: [], types: sp.types.slice() });
    app.pin = SPOTS.length - 1; app.inputs.spotName = "";
    go("map"); toast(sp.vis === "Только я" ? "Спот сохранён, видишь только ты" : "Спот добавлен, кенты его видят");

  editRated: () => { app.addEdit = true; app.addKind = st.rateKind; go("add"); },
  addKind: d => { app.addKind = d.v; render(); },
  addQueue: (d, el) => { if (el.classList.contains("off")) return; go("music"); toast("Добавлено в очередь"); },

    if (el.classList.contains("off")) return;
    app.rateTitle = (app.inputs.addTitle ?? app.rateTitle).trim(); app.rateArtist = (app.inputs.addArtist ?? app.rateArtist).trim();
    go("rate", { rateKind: app.addKind });
  },
  topKind: d => { app.topKind = d.v; render(); },
  period: () => { app.period = (app.period + 1) % 3; render(); },
  mineKind: d => { app.mineKind = d.v; render(); },
  mineSort: () => { app.mineByDate = !app.mineByDate; render(); },
};

const scr = $("scr");
scr.addEventListener("click", e => {
  const mp = e.target.closest("[data-act='movePin']");
  if (mp && !e.target.closest(".chip")) {
    const r = mp.getBoundingClientRect();
    app.spot.px = Math.round((e.clientX - r.left) / r.width * 100);
    app.spot.py = Math.round((e.clientY - r.top) / r.height * 100) + 8;
    return render();
  }
  const el = e.target.closest("[data-go], [data-act], [data-set]");
  if (!el || el.dataset.slide) return;
  if (el.closest(".layer[class*='out-']")) return;
  if (el.dataset.go) return go(el.dataset.go, el.dataset.mode ? { aiMode: el.dataset.mode } : {});
  if (el.dataset.set) { st[el.dataset.set] = el.dataset.v; save(); return render(); }
  ACTS[el.dataset.act]?.(el.dataset, el);
});
// typing re-renders only screens whose content depends on the text (search, live checks)
const LIVE = ["listSearch", "mapSearch", "kentSearch", "epUser", "epName", "addTitle"];
scr.addEventListener("input", e => { if (!e.target.id) return; app.inputs[e.target.id] = e.target.value; if (LIVE.includes(e.target.id)) render(); });
scr.addEventListener("keydown", e => { if (e.key === "Enter" && ["chatInput", "aiInput", "groupInput"].includes(e.target.id)) { e.preventDefault(); send(e.target.id); } });

// rating sliders: drag along the track, value snaps to 1..10
let drag = null;
function slideTo(x) {
  const v = Math.min(10, Math.max(1, Math.round((x - drag.left) / drag.width * 10)));
  const vals = app.vals[critKey()];
  if (vals[drag.i] !== v) { vals[drag.i] = v; render(); }
}
scr.addEventListener("pointerdown", e => {
  const sl = e.target.closest("[data-slide]");
  if (!sl) return;
  const r = sl.getBoundingClientRect();
  drag = { i: +sl.dataset.slide, left: r.left, width: r.width };
  e.preventDefault();
  slideTo(e.clientX);
});
window.addEventListener("pointermove", e => { if (drag) slideTo(e.clientX); });
window.addEventListener("pointerup", () => { drag = null; });

$("copyBtn").addEventListener("click", e => {
  const btn = e.currentTarget;
  navigator.clipboard.writeText(summary())
    .then(() => { btn.textContent = "Скопировано"; setTimeout(() => btn.textContent = "Скопировать итог", 1500); })
    .catch(() => {
      const r = document.createRange(); r.selectNodeContents($("summary"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = "Выделил, скопируй вручную";
    });
});

render();
</script>
